<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>SeatSync — Logowanie</title>
</head>
<body>
<header class="header">
    <a class="logo" href="index.html"><img src="logo.jpg" alt="SeatSync" width="164" height="40"></a>
    <nav class="nav">
        <ul class="nav-list">
            <li><a class="nav-link" href="index.html#filmy">Filmy</a></li>
            <li><a class="nav-link" href="index.html#koncerty">Koncerty</a></li>
            <li><a class="nav-link" href="index.html#standupy">Stand-up</a></li>
            <li><a class="nav-link" href="index.html#teatr">Teatr</a></li>
        </ul>
    </nav>
    <div class="actions">
        <a class="nav-link" href="#kontakt">Kontakt</a>
        <a class="nav-link" href="login.html">Logowanie</a>
    </div>
</header>

<main class="account">
    <h1 class="title">Konto SeatSync</h1>
    <section class="panel">
        <h2>Logowanie</h2>
        <form class="form">
            <div class="field">
                <label for="email">Adres e-mail:</label>
                <input class="input" type="email" id="email" name="email" required>
            </div>
            <div class="field">
                <label for="password">Hasło:</label>
                <input class="input" type="password" id="password" name="password" required>
            </div>
            <div class="check">
                <input type="checkbox" id="remember" name="remember">
                <label for="remember">Zapamiętaj mnie</label>
            </div>
            <button class="button" type="submit">Zaloguj się</button>
        </form>
        <p><a class="link" href="#register">Nie masz konta? Zarejestruj się!</a></p>
    </section>

    <section class="panel" id="register">
        <h2>Rejestracja</h2>
        <form class="form">
            <div class="field">
                <label for="signup-name">Imię i nazwisko:</label>
                <input class="input" type="text" id="signup-name" name="name" required>
            </div>
            <div class="field">
                <label for="signup-email">Adres e-mail:</label>
                <input class="input" type="email" id="signup-email" name="email" required>
            </div>
            <div class="field">
                <label for="new-password">Hasło:</label>
                <input class="input" type="password" id="new-password" name="password" required>
            </div>
            <div class="field">
                <label for="confirm">Powtórz hasło:</label>
                <input class="input" type="password" id="confirm" name="confirm" required>
            </div>
            <button class="button" type="submit">Załóż konto</button>
        </form>
    </section>
</main>

<footer class="footer" id="kontakt">
    <p>2026 SeatSync — Piotr</p>
    <p>Kontakt: piotr@example.com</p>
</footer>
</body>
</html>
